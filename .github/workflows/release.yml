name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 让 git describe --tags 能拿到版本号

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/.cocoapods
          key: pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Build app (no signing)
        run: bash scripts/build_app.sh

      - name: Build installer pkg (no signing)
        run: bash scripts/build_installer.sh

      - name: Upload artifacts (供调试下载)
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-${{ github.ref_name }}
          path: |
            dist/Lotus.pkg
            dist/Lotus.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Lotus ${{ github.ref_name }}

            ### 安装方法
            1. 下载 `Lotus.pkg` 双击安装
            2. 打开「系统设置 → 键盘 → 输入法」添加「青青输入法」
          files: |
            dist/Lotus.pkg
            dist/Lotus.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
